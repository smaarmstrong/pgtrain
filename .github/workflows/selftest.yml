name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Pull postgres:16
        run: docker pull postgres:16

      - name: Run the full selftest (SQL, state, and app tasks)
        run: ./selftest.py -j 4
